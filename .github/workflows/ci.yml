name: BetterDiscord CI

on:
  workflow_dispatch:
    inputs:
      macos_recovery_timeout_seconds:
        description: "macOS recovery helper timeout in seconds"
        default: "45"
  push:
    branches: ["develop"]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".gitattributes"
      - "AGENTS.md"
      - "LICENSE*"
  pull_request:
    branches: ["develop"]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".gitattributes"
      - "AGENTS.md"
      - "LICENSE*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test

      - name: Lint code
        run: bun run lint

      - name: Check types
        run: bun run typecheck

      - name: Build asar
        run: bun run dist
        env:
          BRANCH_NAME: ${{github.head_ref || github.ref_name}}
          COMMIT_HASH: ${{github.sha}}
          BETTERDISCORD_MACOS_RECOVERY_TIMEOUT_SECONDS: ${{inputs.macos_recovery_timeout_seconds || '45'}}

      # Only upload artifact on PR, otherwise it gets pushed to canary
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: ${{github.event_name == 'pull_request'}}
        with:
          if-no-files-found: error
          retention-days: 30
          archive: false
          path: dist/betterdiscord.asar

      # Keep a single rolling release for the latest develop commit.
      - name: Reset rolling release
        if: ${{github.event_name == 'push' || github.event_name == 'workflow_dispatch'}}
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: gh release delete develop-latest --yes --cleanup-tag || true

      - name: Publish rolling release
        if: ${{github.event_name == 'push' || github.event_name == 'workflow_dispatch'}}
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          notes="$(printf 'Rolling release for the latest develop commit.\n\nCommit: %s\n' "${GITHUB_SHA}")"
          gh release create develop-latest dist/betterdiscord.asar \
            --target "${GITHUB_SHA}" \
            --title "BD Dev Fork" \
            --notes "${notes}"
